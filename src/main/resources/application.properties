spring.application.name=country-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/country_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

country.soap.endpoint=${COUNTRY_SOAP_ENDPOINT:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
country.soap.connect-timeout=${COUNTRY_SOAP_CONNECT_TIMEOUT:2s}
country.soap.read-timeout=${COUNTRY_SOAP_READ_TIMEOUT:5s}
