spring.application.name=country-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/country_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

country.soap.endpoint=${COUNTRY_SOAP_ENDPOINT:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
country.soap.connect-timeout=${COUNTRY_SOAP_CONNECT_TIMEOUT:2s}
country.soap.read-timeout=${COUNTRY_SOAP_READ_TIMEOUT:5s}

# Resilience applies only to outbound SOAP operations, never to database writes.
country.soap.retry.max-attempts=2
country.soap.retry.delay=200ms
country.soap.circuit.window-size=10
country.soap.circuit.minimum-calls=4
country.soap.circuit.failure-rate=50
country.soap.circuit.open-duration=10s

logging.structured.format.console=logstash
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
