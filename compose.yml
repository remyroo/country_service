services:
  mysql:
    image: mysql:8.4
    container_name: country-service-mysql
    environment:
      MYSQL_DATABASE: country_db
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h localhost -u "$${MYSQL_USER}" -e "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
